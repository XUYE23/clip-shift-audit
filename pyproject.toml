[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clip-shift-audit"
version = "0.1.0"
description = "Calibration and open-set evaluation for cached CLIP embeddings."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "XUYE23"}]
dependencies = ["numpy>=1.24"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.urls]
Repository = "https://github.com/XUYE23/clip-shift-audit"
Issues = "https://github.com/XUYE23/clip-shift-audit/issues"

[project.scripts]
clip-shift-audit = "clip_shift_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
